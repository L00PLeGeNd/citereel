[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "citereel"
version = "0.1.1"
description = "Verifiable, comparable, reproducible RAG run records with citation evidence checks."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Yinghuai Fu" }]
keywords = [
  "rag",
  "citations",
  "citation-verification",
  "evaluation",
  "replay",
  "observability",
  "llm",
  "grounding",
  "cli",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Utilities",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.0",
]

[project.optional-dependencies]
# Keep core install tiny. Pull extras only when needed.
dev = ["pytest>=8.0"]
llm = ["openai>=1.40"]
embed = ["sentence-transformers>=3.0"]
pdf = ["pypdf>=4.0"]
gui = ["pywebview>=5.0"]
all = [
  "openai>=1.40",
  "sentence-transformers>=3.0",
  "pypdf>=4.0",
  "pywebview>=5.0",
]

[project.urls]
Homepage = "https://github.com/L00PLeGeNd/citereel"
Repository = "https://github.com/L00PLeGeNd/citereel"
Issues = "https://github.com/L00PLeGeNd/citereel/issues"

[project.scripts]
citereel = "citereel.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
citereel = ["py.typed", "bundled/demo_docs/*", "bundled/eval/*", "gui/static/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
